name: Collect App Store charts

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-charts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect charts
        run: python part-2-gamesonar/scripts/collect_charts.py
      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add part-2-gamesonar/data/
          if git diff --staged --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "data: chart snapshot $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
      - name: Job summary
        if: always()
        run: |
          echo "### Chart snapshot $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          tail -n 1 part-2-gamesonar/data/_runs.jsonl >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
