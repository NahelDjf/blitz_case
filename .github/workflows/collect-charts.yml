name: Collect App Store charts

on:
  schedule:
    # 06:17 UTC daily. Deliberately off the hour: scheduled jobs queued at
    # :00 get delayed the most, and Apple's charts refresh overnight anyway.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      countries:
        description: "Space-separated storefronts (default: us gb de fr jp br)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: collect-charts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect charts
        run: |
          if [ -n "${{ inputs.countries }}" ]; then
            python scripts/collect_charts.py --countries ${{ inputs.countries }}
          else
            python scripts/collect_charts.py
          fi

      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "data: chart snapshot $(date -u +%Y-%m-%d)"
          # Another run may have landed while this one was fetching.
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push

      - name: Job summary
        if: always()
        run: |
          echo "### Chart snapshot $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          tail -n 1 data/_runs.jsonl >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
